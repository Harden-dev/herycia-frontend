name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Tests unitaires
        run: pnpm test:unit --run

      - name: Build
        run: pnpm build-only

  lint:
    # Sans --fix : la CI vérifie, elle ne corrige pas (pnpm lint corrige en local).
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: oxlint
        run: pnpm exec oxlint .

      - name: ESLint
        run: pnpm exec eslint .
